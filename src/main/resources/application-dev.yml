spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservacanchas
    username: reservacanchas
    password: reservacanchas
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-for-hs256-algorithm-0123456789}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.reservacanchas: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
