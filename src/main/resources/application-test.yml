spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservacanchas_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

jwt:
  secret: ${JWT_SECRET:test-secret-key-minimum-256-bits-for-hs256-algorithm-0123456789}
  expiration: ${JWT_EXPIRATION:86400000}

clips:
  ffmpeg:
    simulado: true
almacenamiento:
  tipo: local
  local:
    directorio: target/almacenamiento_test/clips

logging:
  level:
    com.reservacanchas: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
