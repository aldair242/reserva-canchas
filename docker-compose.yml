services:
  postgres:
    image: postgres:16-alpine
    container_name: reservacanchas-postgres
    environment:
      POSTGRES_DB: reservacanchas
      POSTGRES_USER: reservacanchas
      POSTGRES_PASSWORD: reservacanchas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservacanchas -d reservacanchas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
